name: LicenseProof CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run direct, adversarial, property, semantic, and harness tests
        run: >-
          python -m pytest -q tests/direct tests/adversarial tests/property
          tests/semantic tests/harness

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run mutation audit
        run: python scripts/mutation_audit.py

      - name: Verify schema and ABI parity
        run: python scripts/verify_schema.py

      - name: Verify frozen source
        run: python scripts/verify_source.py

      - name: Secret scan
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          patterns = [
              re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]
          findings = []
          for name in tracked:
              path = Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append(name)
                      break
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")
          print("SECRET_SCAN=PASS")
          PY
