name: LicenseProof CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CONTRACT_SHA256: 02be068e55968828556245c27c3511c7a78138216177ba4b65f0464ba316221f
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install qualified 5j runner descriptor
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          runner_hash = "5jycge4q8k23462jtb0b9fyey1s9qz928sz2nbrd9mg4sxqg2qng"
          source = Path("ci/runners/py-genlayer") / runner_hash / "runner.json"
          target = Path.home() / ".cache/gltest-direct/extracted/local/py-genlayer" / runner_hash / "runner.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source.read_bytes())
          print(f"Installed {runner_hash} at {target}")

          std_hash = "kzr02ndm9et4qkmbqpq5djjt5sme2yt76n7sz1qbzax0knt6mam0"
          archive = Path("ci/runners/py-lib-genlayer-std") / std_hash / "runner.zip"
          std_target = Path.home() / ".cache/gltest-direct/extracted/local/py-lib-genlayer-std" / std_hash
          std_target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as payload:
              payload.extractall(std_target)
          print(f"Installed {std_hash} at {std_target}")
          PY

      - name: Run direct, adversarial, property, semantic, and harness tests
        run: >-
          python -m pytest -q tests/direct tests/adversarial tests/property
          tests/semantic tests/harness

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify schema and ABI parity
        run: python scripts/verify_schema.py

      - name: Verify frozen source
        run: python scripts/verify_source.py

      - name: Verify read-only checkers did not modify files
        run: git diff --exit-code

      - name: Run mutation audit
        run: python scripts/mutation_audit.py


      - name: Gitleaks independent secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scan
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          patterns = [
              re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]
          findings = []
          for name in tracked:
              path = Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append(name)
                      break
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")
          print("SECRET_SCAN=PASS")
          PY
